name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - overrides/**
      - mkdocs.yml
      - internal/**
      - sanitize/**
      - rewrite/**
      - wasm/**
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so git describe stamps the wasm build with the real tag.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make wasm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install mkdocs-material
      - run: mkdocs build --strict
      # slop-chop.com and www.slop-chop.com are custom domains on the slop-chop-site
      # Worker, so the Worker is what visitors reach. This used to publish to GitHub Pages
      # instead, which nothing points at, and the live site sat frozen at whatever someone
      # last deployed by hand.
      - name: Deploy the site
        env:
          CANONICAL: dcadolph/slop-chop
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            # A fork has no deploy credentials and should still get a green build. On the
            # repository that owns slop-chop.com a missing token is a broken deploy, and
            # skipping it quietly turned every run green while the live site went stale,
            # so here it fails loudly instead.
            if [ "${GITHUB_REPOSITORY}" = "${CANONICAL}" ]; then
              echo "::error::CLOUDFLARE_API_TOKEN is not set on ${CANONICAL}, so the site" \
                "was built but never deployed. Add the CLOUDFLARE_API_TOKEN and" \
                "CLOUDFLARE_ACCOUNT_ID repository secrets."
              exit 1
            fi
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the site was built but not"
            echo "::warning::deployed. slop-chop.com keeps serving whatever it served before."
            exit 0
          fi
          npx -y wrangler@4 deploy --config wrangler.site.jsonc
