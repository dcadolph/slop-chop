name: docs

on:
  push:
    branches: [main]
    # The bump commit reaches main before its tag exists, so that build is stamped with the
    # previous tag. The tag push rebuilds the site from the tag itself. Path filters do not
    # apply to tag pushes.
    tags: ['v*']
    paths:
      - docs/**
      - overrides/**
      - mkdocs.yml
      - internal/**
      - sanitize/**
      - rewrite/**
      - wasm/**
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so git describe stamps the wasm build with the real tag.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make wasm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pip install mkdocs-material
      # The README coverage badge reads site/coverage.json, so the number comes from a real
      # test run on every site build and cannot drift from the code.
      # The README coverage badge reads site/coverage.json, so the number is the one this run
      # measures and no third-party coverage service needs a token.
      - name: Measure test coverage for the badge
        run: go test -coverprofile=coverage.out ./...
      - run: mkdocs build --strict
      # The Worker serves each page at /PAGE and answers /PAGE.html with a redirect, but mkdocs
      # writes every canonical, og:url, sitemap entry, nav link, and search result as PAGE.html.
      # Search engines then see a canonical that redirects, and every click costs a round trip.
      # The rewrite strips .html from those URLs and maps index.html to the site root. It only
      # touches href and content values, sitemap entries, and search index locations that name
      # a slop-chop page, so external links and code samples that mention a .html file keep
      # their text. The guard fails the build if mkdocs ever emits a form the rewrite misses.
      - name: Point every page URL at the address the Worker serves
        run: |
          set -euo pipefail
          locs_before="$(grep -c '<loc>' site/sitemap.xml)"
          find site -name '*.html' -print0 | xargs -0 sed -i -E \
            -e 's#https://slop-chop\.com/index\.html#https://slop-chop.com/#g' \
            -e 's#https://slop-chop\.com/([A-Za-z0-9_-]+)\.html#https://slop-chop.com/\1#g' \
            -e 's#href="index\.html#href="./#g' \
            -e 's#href="/index\.html#href="/#g' \
            -e 's#href="(/?)([A-Za-z0-9_-]+)\.html#href="\1\2#g'
          sed -i -E \
            -e 's#https://slop-chop\.com/index\.html#https://slop-chop.com/#g' \
            -e 's#https://slop-chop\.com/([A-Za-z0-9_-]+)\.html#https://slop-chop.com/\1#g' \
            site/sitemap.xml
          sed -i -E \
            -e 's#"location":"index\.html#"location":"./#g' \
            -e 's#"location":"([A-Za-z0-9_-]+)\.html#"location":"\1#g' \
            site/search/search_index.json
          fail=0
          if grep -rEq 'slop-chop\.com/[A-Za-z0-9_-]+\.html' site/; then
            echo "::error::A page still advertises a slop-chop.com URL ending in .html."
            fail=1
          fi
          if grep -rEq 'href="/?[A-Za-z0-9_-]+\.html' site/; then
            echo "::error::A page still links to a slop-chop page by its .html file name."
            fail=1
          fi
          if grep -Eq '"location":"[A-Za-z0-9_-]+\.html' site/search/search_index.json; then
            echo "::error::The search index still points results at .html file names."
            fail=1
          fi
          locs_after="$(grep -c '<loc>' site/sitemap.xml)"
          if [ "$locs_after" != "$locs_before" ]; then
            echo "::error::The sitemap went from ${locs_before} pages to ${locs_after}."
            fail=1
          fi
          if ! grep -q '<link rel="canonical" href="https://slop-chop.com/">' site/index.html; then
            echo "::error::The homepage canonical is not https://slop-chop.com/."
            fail=1
          fi
          exit "$fail"
      # A missing, malformed, or zero total must fail the build, because go tool cover reports
      # 0.0% for an empty profile and a badge that quietly shows that is worse than a stale one.
      - name: Write the coverage badge endpoint
        run: |
          set -euo pipefail
          total="$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')"
          if ! printf '%s' "$total" | grep -Eq '^[0-9]+(\.[0-9]+)?$' || [ "${total%%.*}" = "0" ]; then
            echo "::error::Could not read a coverage total from coverage.out."
            exit 1
          fi
          jq -n --arg message "$(printf '%.1f%%' "$total")" \
            '{schemaVersion: 1, label: "coverage", message: $message, color: "9bcf1a"}' \
            > site/coverage.json
      # slop-chop.com and www.slop-chop.com are custom domains on the slop-chop-site
      # Worker, so the Worker is what visitors reach. This used to publish to GitHub Pages
      # instead, which nothing points at, and the live site sat frozen at whatever someone
      # last deployed by hand.
      - name: Deploy the site
        env:
          CANONICAL: dcadolph/slop-chop
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            # A fork has no deploy credentials and should still get a green build. On the
            # repository that owns slop-chop.com a missing token is a broken deploy, and
            # skipping it quietly turned every run green while the live site went stale,
            # so here it fails loudly instead.
            if [ "${GITHUB_REPOSITORY}" = "${CANONICAL}" ]; then
              echo "::error::CLOUDFLARE_API_TOKEN is not set on ${CANONICAL}, so the site" \
                "was built but never deployed. Add the CLOUDFLARE_API_TOKEN and" \
                "CLOUDFLARE_ACCOUNT_ID repository secrets."
              exit 1
            fi
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the site was built but not"
            echo "::warning::deployed. slop-chop.com keeps serving whatever it served before."
            exit 0
          fi
          npx -y wrangler@4 deploy --config wrangler.site.jsonc
