name: release

# Cross-builds slop-chop on every v* tag, attaches the Homebrew-style archives and
# checksums to the release, then publishes every downstream surface that carries the
# engine: the Homebrew formula, the Obsidian plugin, and the npm package. Each publish
# needs its own token and skips with a note when that token is absent, so a fork or a
# token-less run still cuts a normal release.
#
# The Obsidian plugin and the npm package take the tag with its "v" stripped, so one
# version identifies the engine on every surface and none of them can drift again.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # npm publishes over OIDC rather than a token. The account requires a second factor for
  # publishing and CI cannot answer an authenticator prompt, so a token always fails with
  # EOTP. GitHub signs a short-lived identity here and npm trusts this repository and
  # workflow directly, which needs no secret and nothing to rotate.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      PLUGIN_TOKEN: ${{ secrets.OBSIDIAN_PLUGIN_TOKEN }}
      # The stores below publish the moment their secret exists and skip with a warning
      # until then. Once a store has shipped from CI a few times, promote its skip to the
      # same loud failure the Homebrew and Obsidian steps use.
      OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
      JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      # A fork has no publish credentials and should still cut a normal release, so a
      # missing token is skipped there. On the repository that owns these channels a
      # missing token is a publish that silently did not happen, which is how a stale
      # release goes unnoticed, so the steps below fail instead.
      CANONICAL: dcadolph/slop-chop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Test
        run: go test ./...

      - name: Install gox
        run: go install github.com/mitchellh/gox@latest

      - name: README action pin must match this release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! grep -q "uses: dcadolph/slop-chop@${TAG}" README.md; then
            echo "::error::README.md pins a different action version than ${TAG}." \
              "Update the two CI examples before tagging, so copy-pasters get this engine."
            exit 1
          fi

      - name: Cross-build and package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          mkdir -p build dist
          gox -osarch="darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64" \
            -ldflags="-s -w -X github.com/dcadolph/slop-chop/cmd.version=${VER}" \
            -output="build/slop-chop_{{.OS}}_{{.Arch}}" .
          # gox predates windows/arm64 and silently skips it, so that one is built
          # directly.
          GOOS=windows GOARCH=arm64 go build \
            -ldflags="-s -w -X github.com/dcadolph/slop-chop/cmd.version=${VER}" \
            -o build/slop-chop_windows_arm64.exe .
          for f in build/slop-chop_*; do
            base="${f#build/slop-chop_}"
            base="${base%.exe}"
            os="${base%%_*}"
            arch="${base##*_}"
            case "$os" in darwin) osl=Darwin ;; linux) osl=Linux ;; windows) osl=Windows ;; esac
            case "$arch" in amd64) al=x86_64 ;; arm64) al=arm64 ;; esac
            if [ "$os" = windows ]; then
              cp "$f" build/slop-chop.exe
              ( cd build && zip -q "../dist/slop-chop_${VER}_${osl}_${al}.zip" slop-chop.exe )
              rm build/slop-chop.exe
            else
              cp "$f" build/slop-chop
              tar -C build -czf "dist/slop-chop_${VER}_${osl}_${al}.tar.gz" slop-chop
              rm build/slop-chop
            fi
          done
          ( cd dist && sha256sum *.tar.gz *.zip | tee checksums.txt )

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          fail_on_unmatched_files: true

      - name: Bump Homebrew formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            if [ "${GITHUB_REPOSITORY}" = "${CANONICAL}" ]; then
              echo "::error::HOMEBREW_TAP_TOKEN is not set on ${CANONICAL}, so the formula" \
                "was never bumped and brew still installs the previous release."
              exit 1
            fi
            echo "HOMEBREW_TAP_TOKEN not set; skipping formula bump"
            exit 0
          fi
          VER="${TAG#v}"
          da=$(sha256sum "dist/slop-chop_${VER}_Darwin_arm64.tar.gz" | cut -d' ' -f1)
          di=$(sha256sum "dist/slop-chop_${VER}_Darwin_x86_64.tar.gz" | cut -d' ' -f1)
          la=$(sha256sum "dist/slop-chop_${VER}_Linux_arm64.tar.gz" | cut -d' ' -f1)
          li=$(sha256sum "dist/slop-chop_${VER}_Linux_x86_64.tar.gz" | cut -d' ' -f1)
          base="https://github.com/dcadolph/slop-chop/releases/download/v${VER}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/dcadolph/homebrew-tap.git" tap
          cat > tap/Formula/slop-chop.rb <<EOF
          class SlopChop < Formula
            desc "Strip AI writing tells so text reads like a human wrote it"
            homepage "https://github.com/dcadolph/slop-chop"
            version "${VER}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/slop-chop_${VER}_Darwin_arm64.tar.gz"
                sha256 "${da}"
              end
              on_intel do
                url "${base}/slop-chop_${VER}_Darwin_x86_64.tar.gz"
                sha256 "${di}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/slop-chop_${VER}_Linux_arm64.tar.gz"
                sha256 "${la}"
              end
              on_intel do
                url "${base}/slop-chop_${VER}_Linux_x86_64.tar.gz"
                sha256 "${li}"
              end
            end

            def install
              bin.install "slop-chop"
            end

            test do
              system "#{bin}/slop-chop", "--version"
            end
          end
          EOF
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/slop-chop.rb
          # A re-run of a tag that already shipped rewrites the same formula, so there is
          # nothing staged and nothing to push. Committing anyway would fail the release.
          if git diff --cached --quiet; then
            echo "the formula already holds ${VER}; nothing to bump"
            exit 0
          fi
          git commit -m "Update slop-chop to ${VER}"
          git push

      - name: Publish the Obsidian plugin
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${PLUGIN_TOKEN:-}" ]; then
            if [ "${GITHUB_REPOSITORY}" = "${CANONICAL}" ]; then
              echo "::error::OBSIDIAN_PLUGIN_TOKEN is not set on ${CANONICAL}, so the plugin" \
                "was never published and the vault installer still serves the previous release."
              exit 1
            fi
            echo "OBSIDIAN_PLUGIN_TOKEN not set; skipping the Obsidian plugin publish"
            exit 0
          fi
          VER="${TAG#v}"
          # The manifest version is the tag without its "v", and the plugin release tag has
          # to equal it exactly: Obsidian installs from the release whose tag matches the
          # manifest sitting at the head of the default branch.
          jq --arg v "$VER" '.version = $v' obsidian/manifest.json > manifest.tmp
          mv manifest.tmp obsidian/manifest.json
          MIN=$(jq -r .minAppVersion obsidian/manifest.json)
          jq --arg v "$VER" --arg m "$MIN" '.[$v] = $m' obsidian/versions.json > versions.tmp
          mv versions.tmp obsidian/versions.json
          make obsidian
          git clone "https://x-access-token:${PLUGIN_TOKEN}@github.com/dcadolph/slop-chop-obsidian.git" plugin
          cp obsidian/dist/main.js obsidian/manifest.json obsidian/versions.json plugin/
          # The plugin repo rebuilds the bundle from the monorepo for provenance. Its pin
          # lives in the ENGINE_REF file, updated here so the rebuild always uses the
          # commit this release was cut from.
          printf '%s\n' "${GITHUB_SHA}" > plugin/ENGINE_REF
          cd plugin
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add main.js manifest.json versions.json ENGINE_REF
          # A rebuild with no engine change produces the same bytes, so there is nothing to
          # commit and nothing to release.
          if git diff --cached --quiet; then
            echo "the plugin already holds ${VER}; nothing to publish"
            exit 0
          fi
          git commit -m "Update to ${VER}"
          git push
          # Push the tag and stop. The plugin repo's own workflow builds from the pin
          # written above, gates the bundle, attests its provenance, and creates the
          # release. Creating the release here instead would win the race and publish
          # these unattested bytes, leaving that workflow to fail on a tag it cannot
          # reuse.
          git tag "${VER}"
          git push origin "${VER}"

      # OIDC publishing needs npm 11.5.1 or newer, which is ahead of the npm the runner
      # ships with its default Node.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish the npm package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          npm install -g npm@latest
          VER="${TAG#v}"
          # Republishing a version the registry already holds is an error rather than a
          # no-op, so a re-run of a tag that already shipped stops here.
          if npm view "slop-chop-wasm@${VER}" version >/dev/null 2>&1; then
            echo "slop-chop-wasm@${VER} is already published; nothing to do"
            exit 0
          fi
          make npm-package
          jq --arg v "$VER" '.version = $v' npm/package.json > pkg.tmp
          mv pkg.tmp npm/package.json
          npm publish npm/ --access public --provenance

      - name: Publish to OpenVSX
        id: openvsx
        continue-on-error: true
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${OVSX_TOKEN:-}" ]; then
            echo "::warning::OVSX_TOKEN is not set, so OpenVSX still serves its previous" \
              "release. Add the secret and re-run to publish from CI."
            exit 0
          fi
          VER="${TAG#v}"
          if curl -sf "https://open-vsx.org/api/dcadolph/slop-chop/${VER}" >/dev/null; then
            echo "OpenVSX already holds ${VER}; nothing to do"
            exit 0
          fi
          ( cd vscode && npx -y @vscode/vsce package --no-dependencies )
          npx -y ovsx publish "vscode/slop-chop-${VER}.vsix" -p "$OVSX_TOKEN"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Publish the JetBrains plugin
        id: jetbrains
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -z "${JETBRAINS_MARKETPLACE_TOKEN:-}" ]; then
            echo "::warning::JETBRAINS_MARKETPLACE_TOKEN is not set, so the JetBrains" \
              "Marketplace still serves its previous release. Add the secret and re-run" \
              "to publish from CI."
            exit 0
          fi
          # The marketplace rejects a version it already holds, which is what a re-run of
          # a shipped tag looks like, so that one rejection is a no-op rather than a
          # failure.
          out="$(cd jetbrains && ./gradlew publishPlugin --no-daemon 2>&1)" && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && echo "$out" | grep -qi "already uploaded\|version.*exists"; then
            echo "the marketplace already holds this version; nothing to publish"
            exit 0
          fi
          exit "$rc"

      - name: Publish the Firefox extension
        id: firefox
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -z "${AMO_JWT_ISSUER:-}" ] || [ -z "${AMO_JWT_SECRET:-}" ]; then
            echo "::warning::AMO_JWT_ISSUER and AMO_JWT_SECRET are not set, so" \
              "addons.mozilla.org still serves its previous release. Add both secrets" \
              "and re-run to publish from CI."
            exit 0
          fi
          make extension-firefox
          # The upload goes into Mozilla's review queue rather than straight to users, so
          # this submits and returns instead of waiting for a human reviewer.
          out="$(npx -y web-ext sign --source-dir extension-firefox \
            --channel listed --approval-timeout 0 \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" 2>&1)" && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && echo "$out" | grep -qi "version already exists"; then
            echo "AMO already holds this version; nothing to submit"
            exit 0
          fi
          exit "$rc"

      # Each store publish above records its outcome instead of failing the job on the
      # spot, so one bad credential cannot cost the other four channels their release.
      # This step turns those outcomes into a single verdict, naming every store that
      # failed rather than stopping at the first.
      - name: Every store that was configured must have published
        env:
          OPENVSX: ${{ steps.openvsx.outcome }}
          JETBRAINS: ${{ steps.jetbrains.outcome }}
          FIREFOX: ${{ steps.firefox.outcome }}
        run: |
          set -uo pipefail
          failed=""
          for store in OPENVSX JETBRAINS FIREFOX; do
            if [ "${!store}" = "failure" ]; then
              failed="${failed} ${store}"
            fi
          done
          if [ -n "${failed}" ]; then
            echo "::error::These store publishes failed:${failed}. The binary release and" \
              "every other channel still shipped. Check the failing step's log for the" \
              "reason, which for a freshly added store is usually the credential."
            exit 1
          fi
          echo "every configured store published"
